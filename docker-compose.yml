name: formgl
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: formgl
      POSTGRES_PASSWORD: formgl
      POSTGRES_DB: formgl
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formgl"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: formgl
      MINIO_ROOT_PASSWORD: formgl-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-setup:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 formgl formgl-secret;
      mc mb --ignore-existing local/formgl;
      exit 0;
      "
  # ── the app itself (optional): `docker compose --profile app up -d --build` ──
  api:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://formgl:formgl@postgres:5432/formgl
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      WEB_ORIGIN: http://localhost:3000
    depends_on: [postgres, redis, minio]
    ports: ["4000:4000"]
  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: "http://api:4000" }
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
  redisdata:
  miniodata:
